<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROS2 · Robótica Fundamental — Unitree Go2 Air</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div class="app-shell">

    <!-- SIDEBAR GLOBAL -->
    <aside class="gsidebar" id="gSidebar"></aside>

    <!-- ÁREA DERECHA -->
    <div class="app-right">

      <!-- TOPBAR -->
      <div class="topbar">
        <button class="gs-toggle" id="gsToggle">☰</button>
        <div class="tb-logo">ROS2<span>//</span>GO2</div>
        <div class="tb-track"><div class="tb-fill" id="tbFill"></div></div>
        <div class="tb-pct" id="tbPct">0%</div>
        <button class="flash-trigger" id="flashBtn">⚡ Repaso</button>
      </div>

      <!-- CONTENIDO DE PÁGINA -->
      <main id="pageContent" class="page-content"></main>

      <!-- FOOTER -->
      <footer class="app-footer">
        Plan de estudios · ROS2 &amp; Robótica Fundamental con Unitree Go2 Air<br>
        <small>Tu progreso se guarda automáticamente en este dispositivo.</small>
        <div class="footer-btns">
          <button class="reset"      id="resetBtn">↺ Reiniciar</button>
          <button class="export-btn" id="exportBtn">↓ Exportar progreso</button>
          <button class="export-btn" id="importBtn">↑ Importar progreso</button>
        </div>
      </footer>

    </div><!-- /app-right -->
  </div><!-- /app-shell -->

  <div class="save-flash" id="flash">✓ Guardado</div>

  <input type="file" id="importInput" accept=".json" style="display:none">

  <!-- TOPIC MODAL -->
  <div class="topic-modal" id="topicModal">
    <div class="topic-card">
      <div class="topic-modal-header">
        <div class="topic-modal-meta">
          <span class="topic-modal-week" id="tmWeek"></span>
          <h3 class="topic-modal-title" id="tmTitle"></h3>
        </div>
        <button class="topic-modal-close" id="tmClose">✕</button>
      </div>
      <p class="topic-modal-desc" id="tmDesc"></p>
      <div class="topic-modal-code" id="tmCode">
        <div class="snippet-header">
          <span class="snippet-label" id="tmCodeLabel">Ejemplo</span>
          <button class="copy-btn" id="tmCopyBtn">⎘</button>
        </div>
        <pre class="snippet-pre" id="tmCodePre"></pre>
      </div>
    </div>
  </div>

  <!-- FLASHCARD MODAL -->
  <div class="flash-modal" id="flashModal">
    <div class="flash-card">
      <div class="flash-header">
        <span class="flash-week" id="flashWeek"></span>
        <span class="flash-counter" id="flashCounter"></span>
        <button class="flash-close" id="flashClose">✕</button>
      </div>
      <div class="flash-q" id="flashQ"></div>
      <div class="flash-conf">
        <button class="conf-btn no-se"  data-conf="1">✗ No lo sé</button>
        <button class="conf-btn dudoso" data-conf="2">~ Más o menos</button>
        <button class="conf-btn domino" data-conf="3">✓ Lo domino</button>
      </div>
      <div class="flash-nav">
        <button class="flash-nav-btn" id="flashPrev">← Anterior</button>
        <button class="flash-nav-btn" id="flashNext">Siguiente →</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
